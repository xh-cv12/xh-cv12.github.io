<!DOCTYPE html>
<!--
  ============================================================
  index.html —— 网页的「骨架」
  作用：决定页面上有什么内容（标题、搜索框、卡片区……）
  搭配：style.css 负责好不好看，app.js 负责能不能交互
  ⚠️ 注意：文件名必须叫 index.html，网站默认只认这个名字
  ============================================================
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- 这行决定手机端能不能正常缩放，删掉的话手机上字会小到看不清 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 这里的内容会显示在浏览器标签页上，也会被搜索引擎收录，记得改 -->
  <title>AI 工具导航 · 一站找齐好用的 AI</title>
  <meta name="description" content="精选 40+ 款 AI 工具，支持按名称、功能、标签实时检索，覆盖对话、绘图、视频、编程、办公等场景。">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== 顶部导航 ===== -->
  <header class="topbar">
    <div class="topbar-inner">
      <a class="logo" href="#">
        <span class="logo-mark">AI</span>
        <span class="logo-text">工具导航</span>
      </a>
      <button id="themeBtn" class="theme-btn" title="切换深色/浅色">🌙</button>
    </div>
  </header>

  <!-- ===== 头部大图区域 ===== -->
  <section class="hero">
    <h1 class="hero-title">找 AI 工具，别再靠收藏夹</h1>
    <p class="hero-sub">精选 <b id="totalCount">0</b> 款实用 AI 工具，输入关键词即刻检索</p>

    <!-- 搜索框：核心功能 -->
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input
        id="searchInput"
        type="text"
        placeholder="试试搜「绘画」「代码」「免费」或工具名…"
        autocomplete="off">
      <button id="clearBtn" class="clear-btn" title="清空">✕</button>
    </div>

    <!-- 分类筛选按钮，由 JS 自动生成 -->
    <div id="categoryBar" class="category-bar"></div>
  </section>

  <!-- ===== 工具卡片区 ===== -->
  <main class="container">
    <div class="result-bar">
      <span id="resultInfo">正在加载…</span>
    </div>

    <!-- 卡片容器，由 app.js 动态填内容 -->
    <div id="grid" class="grid"></div>

    <!-- 搜不到东西时显示的提示，默认隐藏 -->
    <div id="empty" class="empty" hidden>
      <div class="empty-icon">🫥</div>
      <p>没找到相关工具</p>
      <p class="empty-tip">换个关键词试试，或者点「全部」看看所有工具</p>
    </div>
  </main>

  <!-- ===== 页脚 ===== -->
  <footer class="footer">
    <p>工具数据仅作整理分享，版权归各产品官方所有</p>
    <p class="footer-tip">最后更新：2026 年 9 月 · 本站由 HTML + CSS + JavaScript 手写而成</p>
  </footer>

  <!-- 回到顶部按钮 -->
  <button id="topBtn" class="top-btn" hidden>↑</button>

  <!-- 引入 JS：顺序不能反，数据要先用，逻辑后跑 -->
  <script src="tools.js"></script>
  <script src="app.js"></script>
</body>
</html>
